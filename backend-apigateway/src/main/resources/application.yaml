server:
  port: 8080

spring:
  application:
    name: backend-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: product-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/products/**

            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/orders/**

            - id: payment-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/payments/**

            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
